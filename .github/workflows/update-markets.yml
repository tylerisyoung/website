name: Update financial dashboard data

on:
  schedule:
    - cron: "17 */2 * * *"    # about every 2 hours, every day (crypto trades on weekends)
  workflow_dispatch:           # allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices and economic data
        run: python scripts/update_market_data.py
      - name: Commit updated data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add docs/data/markets.json
          git diff --cached --quiet || git commit -m "Update financial dashboard data"
          git push
